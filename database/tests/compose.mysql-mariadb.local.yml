# Disposable local-only MySQL/MariaDB fixtures. No production addresses, external volumes or payments.
name: sqf-mysql-mariadb-fixtures
services:
  mysql80:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: sqf_fixture_root_local_only
      MYSQL_DATABASE: sqf_test
      MYSQL_USER: sqf_fixture
      MYSQL_PASSWORD: sqf_fixture_password_local_only
    ports:
      - "127.0.0.1:13306:3306"
    tmpfs:
      - /var/lib/mysql:rw,size=1073741824
    volumes:
      - ./local-fixture-init.sql:/docker-entrypoint-initdb.d/10-fixture.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 25
      start_period: 20s

  mariadb1011:
    image: mariadb:10.11
    environment:
      MARIADB_ROOT_PASSWORD: sqf_fixture_root_local_only
      MARIADB_DATABASE: sqf_test
      MARIADB_USER: sqf_fixture
      MARIADB_PASSWORD: sqf_fixture_password_local_only
    ports:
      - "127.0.0.1:13311:3306"
    tmpfs:
      - /var/lib/mysql:rw,size=1073741824
    volumes:
      - ./local-fixture-init.sql:/docker-entrypoint-initdb.d/10-fixture.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h127.0.0.1 -uroot -p$$MARIADB_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 25
      start_period: 20s
