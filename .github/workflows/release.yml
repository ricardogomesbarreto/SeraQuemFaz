name: Release — SERÁ QUEM FAZ?

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validar código e testes antes de lançar
        run: npm run verify
      - name: Gerar pacotes de distribuição
        run: bash scripts/build-distribution.sh
      - name: Criar release e anexar os dois pacotes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          FILES=("dist/SeraQuemFaz_site_v${VERSION}.zip" "dist/SeraQuemFaz_codigo_v${VERSION}.zip")
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${FILES[@]}" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "${FILES[@]}" --generate-notes --title "SERÁ QUEM FAZ? ${GITHUB_REF_NAME}"
          fi
