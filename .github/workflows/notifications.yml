name: SQF notificações por e-mail (apenas após homologação)
on:
  workflow_dispatch:
  schedule:
    - cron: '7,22,37,52 * * * *'
permissions:
  contents: read
concurrency:
  group: sqf-email-notifications
  cancel-in-progress: false
jobs:
  deliver:
    runs-on: ubuntu-latest
    if: ${{ vars.SQF_NOTIFICATIONS_ENABLED == 'true' }}
    timeout-minutes: 5
    steps:
      - name: Enviar somente avisos privados autorizados
        env:
          ENDPOINT: ${{ secrets.SQF_NOTIFY_URL }}
          SECRET: ${{ secrets.SQF_NOTIFY_SECRET }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$ENDPOINT" && test -n "$SECRET"
          case "$ENDPOINT" in
            https://*.supabase.co/functions/v1/sqf-notifications) ;;
            *) echo 'Endpoint de notificações inválido' >&2; exit 1 ;;
          esac
          curl --fail --show-error --silent --max-time 120 \
            --request POST \
            --header "x-sqf-notify-secret: $SECRET" \
            --header 'Content-Type: application/json' \
            "$ENDPOINT" > /dev/null
