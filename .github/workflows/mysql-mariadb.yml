name: MySQL MariaDB integration
on:
  pull_request:
  push:
    branches: [feat/mysql-mariadb-migration]
permissions:
  contents: read
jobs:
  database:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: ['mysql:8.0', 'mariadb:10.11']
    services:
      database:
        image: ${{ matrix.image }}
        env:
          MYSQL_ROOT_PASSWORD: sqf-ci-only
          MYSQL_DATABASE: sqf_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -psqf-ci-only"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    steps:
      - uses: actions/checkout@v4
      - name: Install PHP PDO driver
        run: sudo apt-get update && sudo apt-get install -y php-cli php-mysql php-mbstring
      - name: Install schema
        run: docker exec -i ${{ job.services.database.id }} sh -c 'mysql -uroot -p"$MYSQL_ROOT_PASSWORD" sqf_test' < database/mysql/migrations/001_schema.sql
      - name: Lint and integration
        env:
          SQF_DB_PASSWORD: sqf-ci-only
        run: |
          php -l backend/src/Agenda.php
          php -l backend/src/Database.php
          php -l backend/src/Marketplace.php
          php -l database/tests/agenda-integration.php
          php database/tests/agenda-integration.php
