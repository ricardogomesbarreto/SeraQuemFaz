name: Publicar release Sera Quem Faz v3.13.0
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-v3130.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sqf-release-v3130
  cancel-in-progress: false
jobs:
  release:
    name: Verificar, empacotar e publicar v3.13.0
    if: github.repository == 'ricardogomesbarreto/SeraQuemFaz'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 20
    steps:
      - name: Checkout historico completo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validar commit, gerar ZIPs e publicar
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          target=d371fb14e57da68346c8c1d4cc2908c5eb952500
          tag=v3.13.0
          cp docs/versoes/RELEASE-NOTES-v3.13.0.md "$RUNNER_TEMP/notes.md"
          git cat-file -e "$target^{commit}"
          git checkout --detach "$target"
          test "$(git rev-parse HEAD)" = "$target"
          test "$(node -p "require('./package.json').version")" = '3.13.0'
          npm run verify
          npm run build:dist
          site='dist/SeraQuemFaz_site_v3.13.0.zip'
          code='dist/SeraQuemFaz_codigo_v3.13.0.zip'
          test -s "$site" && test -s "$code"
          unzip -tq "$site" >/dev/null
          unzip -tq "$code" >/dev/null
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            existing="$(git rev-list -n1 "$tag" || true)"
            test "$existing" = "$target" || { echo "Tag existente aponta para outro commit"; exit 1; }
            echo "Release ja publicado com commit correto."
          else
            gh release create "$tag" "$site" "$code" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$target" \
              --title "SERÁ QUEM FAZ? v3.13.0" \
              --notes-file "$RUNNER_TEMP/notes.md" \
              --latest
          fi
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json tagName,url,assets \
            --jq '{tag: .tagName, url: .url, assets: [.assets[].name]}'
