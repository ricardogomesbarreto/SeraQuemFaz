name: CI — Qualidade do SERÁ QUEM FAZ?

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Node ${{ matrix.node }} — verificações e testes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Verificar JavaScript
        run: npm run check
      - name: Executar testes automatizados
        run: npm test
      - name: Empacotar site e código
        run: npm run build:dist

      - name: Disponibilizar ZIP para teste da versão
        if: github.ref == 'refs/heads/main' && matrix.node == '24'
        uses: actions/upload-artifact@v4
        with:
          name: SeraQuemFaz-site-e-codigo-${{ github.sha }}
          path: |
            dist/SeraQuemFaz_site_v*.zip
            dist/SeraQuemFaz_codigo_v*.zip
          if-no-files-found: error
          retention-days: 30
