name: CI — Qualidade do SERÁ QUEM FAZ?

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Node ${{ matrix.node }} — verificações e testes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Verificar JavaScript
        run: npm run check
      - name: Executar testes automatizados
        run: npm test
      - name: Empacotar site e código
        run: npm run build:dist

      - name: Disponibilizar ZIP para teste da versão
        if: github.ref == 'refs/heads/main' && matrix.node == '24'
        uses: actions/upload-artifact@v4
        with:
          name: SeraQuemFaz-site-e-codigo-${{ github.sha }}
          path: |
            dist/SeraQuemFaz_site_v*.zip
            dist/SeraQuemFaz_codigo_v*.zip
          if-no-files-found: error
          retention-days: 30

  postgres-agenda:
    name: PostgreSQL — concorrência de agenda
    runs-on: ubuntu-latest
    timeout-minutes: 5
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: sqf_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d sqf_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: test-only
      PGDATABASE: sqf_test
    steps:
      - uses: actions/checkout@v4
      - name: Instalar cliente PostgreSQL
        run: sudo apt-get update -qq && sudo apt-get install -y postgresql-client
      - name: Validar migração e concorrência real
        run: bash tests/postgres/appointment-concurrency.sh
