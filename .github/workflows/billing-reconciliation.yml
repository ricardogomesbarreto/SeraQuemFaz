name: SQF reconciliação financeira (somente após homologação)
on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'
permissions:
  contents: read
concurrency:
  group: sqf-reconciliation
  cancel-in-progress: false
jobs:
  reconcile:
    runs-on: ubuntu-latest
    if: ${{ vars.SQF_FINANCIAL_RECONCILIATION_ENABLED == 'true' }}
    timeout-minutes: 5
    steps:
      - name: Consultar conciliação com credenciais privadas
        env:
          ENDPOINT: ${{ secrets.SQF_RECONCILE_URL }}
          SECRET: ${{ secrets.SQF_RECONCILE_SECRET }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$ENDPOINT" && test -n "$SECRET"
          case "$ENDPOINT" in https://*.supabase.co/functions/v1/sqf-billing/reconcile) ;; *) echo 'Endpoint não permitido' >&2; exit 1;; esac
          curl --fail --show-error --silent --max-time 120 \
            --request POST --header "x-sqf-reconcile-secret: $SECRET" \
            --header 'Content-Type: application/json' "$ENDPOINT" > /dev/null
