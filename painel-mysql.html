<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Minha conta | SERÁ QUEM FAZ?</title><link rel="icon" href="assets/brand/favicon.ico"><link rel="stylesheet" href="assets/site.css"><script defer src="assets/backend-mode.js"></script><script defer src="assets/mysql-api-client.js"></script><script defer src="assets/mysql-dashboard.js"></script></head>
<body><header class="site-header"><div class="container"><a href="index.html"><img src="assets/brand/logo-horizontal.png" alt="Será Quem Faz?" width="180"></a></div></header>
<main class="container dashboard-main"><h1 id="mysqlTitle">Minha conta</h1><p id="mysqlStatus" role="status">Carregando sessão…</p><p class="muted">Ambiente de homologação MySQL/MariaDB. Alguns módulos continuam em migração.</p><button class="button button-outline" id="mysqlLogout" type="button">Sair da conta</button>
<div id="mysqlContent" hidden><section class="card" id="profile"><h2>Meu perfil</h2><form id="mysqlProfile"><label>Nome <input name="full_name" required minlength="2" maxlength="120"></label><label>Apresentação <textarea name="bio" maxlength="1500"></textarea></label><label>Código IBGE <input name="city_ibge" pattern="[0-9]{7}" maxlength="7"></label><button class="button button-primary">Salvar perfil</button></form></section>
<section class="card" id="requests"><h2>Solicitações e mensagens</h2><div id="mysqlRequests"></div></section>
<section class="card" id="agenda"><h2>Agenda</h2><div id="mysqlAppointments"></div></section>
<section class="card"><h2>Notificações</h2><div id="mysqlNotifications"></div></section></div></main></body></html>
